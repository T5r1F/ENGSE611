<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam1</title>
    <link rel="stylesheet" href="exam.css">
</head>
<body>
    <div class="form">
    
        <div class="header">
            <div>
                <h1>สมัคร</h1>
                <p>ง่ายและเร็ว</p>
            </div>
            <span class="close">x</span>
        </div>

        <form action="" method="post">

            <div class="row">
                <input type="text" placeholder="ชื่อ">
                <input type="text" placeholder="นามสกุล">
            </div>

            <div class="form-group">
                <input type="text" placeholder="หมายเลขโทรศัพท์มือถือ">
            </div>
            <div class="form-group">
                <input type="text" placeholder="รหัสผ่านใหม่">
            </div>

                <lable class="birthday">วันเกิด</lable>

                <div class="birthday">
                    <select id="day" name="day">
                        <option value="">เลือกวัน</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8">8</option>
                        <option value="9">9</option>
                        <option value="10">10</option>
                        <option value="11">11</option>
                        <option value="12">12</option>
                        <option value="13">13</option>
                        <option value="14">14</option>
                        <option value="15">15</option>
                        <option value="16">16</option>
                        <option value="17">17</option>
                        <option value="18">18</option>
                        <option value="19">19</option>
                        <option value="20">20</option>
                        <option value="21">21</option>
                        <option value="22">22</option>
                        <option value="23">23</option>
                        <option value="24">24</option>
                        <option value="25">25</option>
                        <option value="26">26</option>
                        <option value="27">27</option>
                        <option value="28">28</option>
                        <option value="29">29</option>
                        <option value="30">30</option>
                        <option value="31">31</option>
                    </select>

                    <select id="month" name="month">
                        <option value="">เลือกเดือน</option>
                        <option value="1">มกราคม</option>
                        <option value="2">กุมภาพันธ์</option>
                        <option value="3">มีนาคม</option>
                        <option value="4">เมษายน</option>
                        <option value="5">พฤษภาคม</option>
                        <option value="6">มิถุนายน</option>
                        <option value="7">กรกฎาคม</option>
                        <option value="8">สิงหาคม</option>
                        <option value="9">กันยายน</option>
                        <option value="10">ตุลาคม</option>
                        <option value="11">พฤศจิกายน</option>
                        <option value="12">ธันวาคม</option>
                    </select>

                    <select id="year" name="year">
                        <option value="">เลือกปี</option>
                        <option value="2024">2024</option>
                        <option value="2023">2023</option>
                        <option value="2022">2022</option>
                        <option value="2021">2021</option>
                        <option value="2020">2020</option>
                        <option value="2019">2019</option>
                        <option value="2018">2018</option>
                        <option value="2017">2017</option>
                        <option value="2016">2016</option>
                        <option value="2015">2015</option>
                        <option value="2014">2014</option>
                        <option value="2013">2013</option>
                        <option value="2012">2012</option>
                        <option value="2011">2011</option>
                        <option value="2010">2010</option>
                        <option value="2009">2009</option>
                        <option value="2008">2008</option>
                        <option value="2007">2007</option>
                        <option value="2006">2006</option>
                        <option value="2005">2005</option>
                        <option value="2004">2004</option>
                        <option value="2003">2003</option>
                        <option value="2002">2002</option>
                        <option value="2001">2001</option>
                        <option value="2000">2000</option>
                    </select>
                </div>

                <label class="title">เพศ</label>

                <div class="gender">
                    <div class="sex">
                        <label>หญิง</label>
                        <input type="radio" name="gender">
                    </div>

                    <div class="sex">
                        <label>ชาย</label>
                        <input type="radio" name="gender">
                    </div>
                </div>

            <p class="info">
                เมื่อคลิก สมัคร แสดงว่าคุณยอมรับข้อกำหนด นโยบายข้อมูลและนโยบายคุกกี้ของเรา คุณอาจได้รับการแจ้งเตือนทาง SMS จากเรา และ สามารถเลือกไม่รับได้ในภายหลัง
            </p>

            <button class="submit-btn" type="submit">สมัคร</button>
        </form>
    </div>

</body>
</html>
