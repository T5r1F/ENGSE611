<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ฟังก์ชันคำนวณเกรด</title>

<style>
    body{
        font-family: Arial, sans-serif;
        background:#f4f4f4;
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
    }

    .container{
        background:white;
        padding:30px;
        border-radius:10px;
        width:400px;
        box-shadow:0 0 10px rgba(0,0,0,0.2);
    }

    h1{
        margin-bottom:20px;
    }

    input{
        width:180px;
        padding:10px;
        font-size:18px;
        border:1px solid #ccc;
        border-radius:5px;
    }

    button{
        padding:10px 20px;
        font-size:16px;
        background:#16b9ff;
        color:white;
        border:none;
        border-radius:5px;
        cursor:pointer;
        margin-left:5px;
    }

    button:hover{
        background:#0099dd;
    }

    #outputBox{
        margin-top:20px;
        background:#000;
        color:white;
        padding:15px;
        border-left:5px solid #00cc66;
        border-radius:5px;
        white-space:pre-line;
        font-size:20px;
    }
</style>
</head>
<body>

<div class="container">

    <h1>ฟังก์ชันคำนวณเกรด<br>(Calculate Grade)</h1>

    <p><b>กรอกคะแนน:</b></p>

    <input type="number" id="scoreInput" placeholder="0 - 100">

    <button onclick="runGrade()">
        คำนวณเกรด
    </button>

    <div id="outputBox">
        ผลลัพธ์จะแสดงที่นี่...
    </div>

</div>

<script>

function calculateGrade(score) {

    if (score >= 80) {
        return "A";
    }
    else if (score >= 70) {
        return "B";
    }
    else if (score >= 60) {
        return "C";
    }
    else if (score >= 50) {
        return "D";
    }
    else {
        return "F";
    }

}

function runGrade() {

    const output = [];

    let score =
        Number(document.getElementById("scoreInput").value);

    // ตรวจสอบข้อมูล
    if (isNaN(score) || score < 0 || score > 100) {

        output.push("⚠ กรุณากรอกคะแนน 0-100");

        document.getElementById("outputBox").textContent =
            output.join("\n");

        return;
    }

    let grade = calculateGrade(score);

    output.push("คะแนน: " + score);
    output.push("เกรดที่ได้: " + grade);

    console.log("คะแนน:", score);
    console.log("เกรด:", grade);

    document.getElementById("outputBox").textContent =
        output.join("\n");
}

</script>

</body>
</html>
