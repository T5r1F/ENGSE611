<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic JavaScript</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        button {
            background-color: #00a8e8;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        #outputBox {
            margin-top: 15px;
            padding: 15px;
            background-color: black;
            color: white;
            border-left: 5px solid limegreen;
            border-radius: 5px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <button onclick="runDemo()">Run Code</button>

    <div id="outputBox"></div>

    <script>
        function runDemo() {
            console.clear();
            const output = [];

            let studentName = 'สมชาย';
            let age = 20;
            let isStudent = true;
            const universityName = 'มหาวิทยาลัยเทคโนโลยี';

            output.push("ชื่อ: " + studentName);
            console.log("ชื่อ:", studentName);

            output.push("อายุ: " + age);
            console.log("อายุ:", age);

            age = 21;
            output.push("อายุใหม่: " + age);
            console.log("อายุใหม่:", age);

            try {
                universityName = 'มหาวิทยาลัยใหม่';
            } catch (e) {
                output.push("Error: " + e.message);
                console.error(e.message);
            }

            document.getElementById("outputBox").textContent =
                output.join("\n");
        }
    </script>

</body>
</html>
