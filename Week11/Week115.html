<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Flow Demo</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        button {
            background: #1db5f1;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
        }

        #outputBox {
            margin-top: 15px;
            background: black;
            color: white;
            padding: 20px;
            border-left: 5px solid #00cc66;
            border-radius: 10px;
            white-space: pre-wrap;
            font-size: 18px;
            width: 600px;
        }
    </style>
</head>
<body>

    <div id="outputBox">ผลลัพธ์จะปรากฏที่นี่...</div>

    <button onclick="runDemo()">Run Code</button>

    <script>
        function runDemo() {

            console.clear();
            const output = [];

            // ค่าเริ่มต้น
            let score = 72;

            // เงื่อนไข if / else
            if (score >= 50) {
                output.push("ผลสอบ: ผ่าน");
                console.log("ผลสอบ: ผ่าน");
            } else {
                output.push("ผลสอบ: ไม่ผ่าน");
                console.log("ผลสอบ: ไม่ผ่าน");
            }

            // วน loop 5 รอบ
            for (let i = 0; i < 5; i++) {
                output.push("รอบที่: " + i);
                console.log("รอบที่:", i);
            }

            // อัปเดตผลลัพธ์บนหน้าเว็บ
            document.getElementById("outputBox").textContent =
                output.join("\n");
        }
    </script>

</body>
</html>
