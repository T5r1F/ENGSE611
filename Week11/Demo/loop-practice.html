<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Loop Practice</title>
    <style>

        body{
            font-family: Arial, sans-serif;
        }

        button{
            background-color: rgb(65, 185, 255);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        #output{
            background-color: #000;
            color: white;
            width: 250px;
            margin-top: 10px;
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid rgb(65, 185, 255);
            font-size: 22px;
        }

    </style>
</head>
<body>

<h1>Loop Practice</h1>

<button onclick="runDemo()">Run Code</button>
<div id="output"> ผลลัพธ์จะแสดงที่นี่... </div>


<script>
    function runDemo() {

        let maxNumber = 20;
        let output = "";

        for(let i = 0; i <= maxNumber; i++) {
            if(i % 2 === 0){
                output += i + " (คู่)<br>";
                console.log(i + " (คู่)");
            } else {
                output += i + " (คี่)<br>";
                console.log(i + " (คี่)");
            }
        }

        output += "<br>";

        for(let i=0; i<=maxNumber; i+=2){
            output += "นับทีละ 2 : " + i + "<br>";
            console.log("นับทีละ 2 :", i);
        }

        output += "<br>";

        for(let i=10; i>=0; i--){
            output += "ถอยหลัง : " + i + "<br>";
            console.log("ถอยหลัง :", i);
        }
        
        document.getElementById("output").innerHTML = output;   
    }
</script>

</body>
</html>
